name: Scrape and deploy

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Commit updated articles.json (if changed)
        run: |
          git config user.name "signal-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/articles.json
          if git diff --staged --quiet; then
            echo "No new articles, nothing to commit."
          else
            git commit -m "Update articles.json [automated]"
            git push
          fi

      - name: Build
        run: npm run build

      - name: Upload build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
